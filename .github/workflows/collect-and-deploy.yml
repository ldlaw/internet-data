# GATE 2B HOSTING REHEARSAL. config/publication.json is "synthetic", so the collector uses the fixture adapter: SIMULATED data, no provider, no network request.
# It publishes only the curated home view, the control document and the schema to this repository's own GitHub Pages site. It cannot touch any other repository:
# the job token is scoped to this repository, no step checks out or pushes anywhere, and no secret or personal token exists.
# A failed gate (tests, validation, quality, permission, collection) fails the job BEFORE deploy, so the previous deployment stays online.
# Every action below is pinned to a full commit SHA that scripts/verify-action-shas.mjs checks against the official upstream repository.
name: collect-and-deploy

on:
  # Schedule ENABLED at Gate 3C step 4 (2026-11-14, the owner's explicit approval): twice an hour, away from the :00 and :30 peaks. Each run regenerates the
  # SIMULATED dataset and re-stamps the control document, so the dashboard keeps its data inside the 75-minute "recent" window and its control inside 24 hours.
  # While config/publication.json is "synthetic" a scheduled run makes no network request. A scheduled run has no inputs, so the fault is always none.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      fault:
        description: 'Rehearse a failure gate (synthetic data only). The run must fail before deploy and leave the previous deployment online.'
        type: choice
        default: none
        options: [none, validation, quality, permission, collection]
  push:                        # a config change (for example the kill switch) deploys at once
    branches: [main]
    paths: ['config/**', 'src/**', 'contracts/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: '22'
      - name: Tests
        run: node --test
      - name: Collect, validate and build the site tree
        env:
          FAULT: ${{ inputs.fault }}
        run: node src/collect.mjs --out site --fault "${FAULT:-none}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
